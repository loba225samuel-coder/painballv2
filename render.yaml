services:
  - type: web
    name: paintball-2d-server
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npx tsx server/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MAX_ROOMS
        value: 200
      - key: MAX_CLIENTS
        value: 400
      # Optionnel : restreindre les connexions à votre site Netlify
      # - key: ALLOWED_ORIGIN
      #   value: https://votre-site.netlify.app
